name: Sağlık Analizi

on:
  workflow_dispatch: # Elle çalıştırma butonu çıkar

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v3

      - name: Python kurulu mu kontrol et
        run: python3 --version

      - name: Python çalıştır
        run: python3 health_analysis.py

      - name: Sonuç dosyasını göster
        run: cat health_results.txt
