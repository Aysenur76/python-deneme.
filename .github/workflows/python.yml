name: saglik-analizi

on:
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check Python version
        run: python3 --version

      - name: Run health analysis
        run: python3 health_analysis.py

      - name: Show results file
        run: cat health_results.txt
